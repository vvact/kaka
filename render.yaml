databases:
  - name: django-db
    plan: free
    databaseName: django_db
    user: django_user

services:
  - type: web
    name: django-api
    env: python
    plan: free
    buildCommand: "./.render/build.sh"
    startCommand: "gunicorn kaka.wsgi:application"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
