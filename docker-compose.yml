version: "3.8"

services:
  # Django API Service
  api:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres-db
      - redis
    networks:
      - ecommerce
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=api.gentlemanwell.shop
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=api.gentlemanwell.shop
      - LETSENCRYPT_EMAIL=vbm7752@gmail.com

  # PostgreSQL Database
  postgres-db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce
    restart: unless-stopped

  # Redis for Celery and caching
  redis:
    image: redis:5-alpine
    networks:
      - ecommerce
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celeryworker
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres-db
    networks:
      - ecommerce
    restart: unless-stopped

  # Flower
  flower:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-flower
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER=redis://redis:6379/0
    ports:
      - "5557:5555"
    depends_on:
      - redis
      - postgres-db
    networks:
      - ecommerce
    restart: unless-stopped

  # 🔹 Replace your old nginx with nginx-proxy
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/certs:/etc/nginx/certs
      - /etc/nginx/vhost.d:/etc/nginx/vhost.d
      - /usr/share/nginx/html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - ecommerce

  # 🔹 Let's Encrypt SSL companion
  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    restart: unless-stopped
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy   # 👈 tell it who the proxy is
    volumes:
      - /etc/nginx/certs:/etc/nginx/certs
      - /etc/nginx/vhost.d:/etc/nginx/vhost.d
      - /usr/share/nginx/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - ecommerce

# Networks
networks:
  ecommerce:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/postgres_data
      o: bind

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/mediafiles
      o: bind
