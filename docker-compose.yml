version: "3.8"

services:
  # Django API Service
  api:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=api.gentlemanwell.shop
      - VIRTUAL_PORT=8000
      - VIRTUAL_PROTO=http
      - LETSENCRYPT_HOST=api.gentlemanwell.shop
      - LETSENCRYPT_EMAIL=vbm7752@gmail.com
      - CLIENT_MAX_BODY_SIZE=200M
      - DATA_UPLOAD_MAX_MEMORY_SIZE=209715200
      - FILE_UPLOAD_MAX_MEMORY_SIZE=209715200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres-db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes  
    volumes:
      - redis_data:/data 
    networks:
      - ecommerce
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celeryworker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower
  flower:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-flower
    env_file:
      - .env
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-password}
    ports:
      - "5557:5555"
    depends_on:
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🔹 Nginx reverse proxy
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DEFAULT_HOST=api.gentlemanwell.shop
    volumes:
      - /home/ubuntu/certs:/etc/nginx/certs:rw
      - /home/ubuntu/vhost.d:/etc/nginx/vhost.d
      - /home/ubuntu/html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # # 🔹 Let's Encrypt SSL companion
  # letsencrypt:
  #   image: nginxproxy/acme-companion:latest
  #   container_name: nginx-letsencrypt
  #   restart: unless-stopped
  #   environment:
  #     - NGINX_PROXY_CONTAINER=nginx-proxy
  #     - DEFAULT_EMAIL=vbm7752@gmail.com
  #   volumes:
  #     - /home/ubuntu/certs:/etc/nginx/certs:rw
  #     - /home/ubuntu/vhost.d:/etc/nginx/vhost.d
  #     - /home/ubuntu/html:/usr/share/nginx/html
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   depends_on:
  #     - nginx-proxy
  #   networks:
  #     - ecommerce

# Networks
networks:
  ecommerce:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/postgres_data
      o: bind

  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/redis_data
      o: bind

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/mediafiles
      o: bind

  acme_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/acme_data
      o: bind
