version: "3.8"

services:
  # Django API Service
  api:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres-db
      - redis
    networks:
      - ecommerce
    restart: unless-stopped

  # PostgreSQL Database
  postgres-db:
    image: postgres:13-alpine
    ports:
      - "5432:5432"  # optional for local dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce
    restart: unless-stopped

  # Redis for Celery and caching
  redis:
    image: redis:5-alpine
    networks:
      - ecommerce
    restart: unless-stopped

  # Celery Worker for async tasks
  celery_worker:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celeryworker
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres-db
    networks:
      - ecommerce
    restart: unless-stopped

  # Flower - Monitoring Celery Tasks
  flower:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-flower
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "5557:5555"
    depends_on:
      - redis
      - postgres-db
    networks:
      - ecommerce
    restart: unless-stopped

  # Nginx for serving static/media files and reverse proxy
  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    networks:
      - ecommerce
    restart: unless-stopped

  # Optional: React Frontend (Enable when ready)
  # client:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: ecommerce_client
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   stdin_open: true
  #   tty: true
  #   networks:
  #     - ecommerce
  #   restart: unless-stopped

# Docker network for internal service communication
networks:
  ecommerce:
    driver: bridge

# Volumes for persistent and shared data, bound to host directories
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/postgres_data
      o: bind

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/ubuntu/mediafiles
      o: bind
